<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --fill:#EFEFF4; --text:#1D1D1F; --muted:#6E6E73; --faint:#AEAEB2;
  --sep:rgba(60,60,67,.16); --accent:#0A7F59; --brand:#0A7F59; --brand-grad:linear-gradient(140deg,#1CCB8B 0%,#0B8A62 100%);
  --brand-soft:#E6F7F0; --green:#248A3D; --red:#D70015; --orange:#B25000; --card:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Heebo","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --bg2:#1C1C1E; --fill:#2C2C2E; --text:#F5F5F7; --muted:#98989D; --faint:#636366; --sep:rgba(84,84,88,.5);
    --accent:#30D158; --brand:#14A86F; --brand-soft:rgba(48,209,88,.14); --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --card:#1C1C1E; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --bg2:#1C1C1E; --fill:#2C2C2E; --text:#F5F5F7; --muted:#98989D; --faint:#636366; --sep:rgba(84,84,88,.5);
  --accent:#30D158; --brand:#14A86F; --brand-soft:rgba(48,209,88,.14); --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --card:#1C1C1E; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:560px;margin:0 auto;padding:12px 16px 60px}
.num{font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.appicon{width:28px;height:28px;border-radius:7px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;color:#fff}
.appicon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.logo{font-weight:700;font-size:17px}
.live{margin-inline-start:auto;font-size:12px;font-weight:600;color:var(--accent);background:var(--brand-soft);padding:4px 10px;border-radius:99px;display:flex;align-items:center;gap:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
h1{font-size:30px;font-weight:700;letter-spacing:-.025em;margin:14px 0 4px;line-height:1.15}
.lead{color:var(--muted);margin:0 0 16px}
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:0 12px;height:50px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;outline:none;height:100%}
.search svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}
.row{display:flex;flex-wrap:wrap;gap:10px}
.field{flex:1 1 200px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:12px;padding:0 12px;height:46px;min-width:0}
.field span{color:var(--muted);font-size:14px;white-space:nowrap}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.go{border:0;height:50px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
.go:disabled{opacity:.5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.chip{border:1px solid var(--sep);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.summary{margin:20px 0 6px;padding:16px;border-radius:16px;background:var(--bg2)}
.summary .big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.summary .verdict{font-weight:600;margin-top:2px}
.ok{color:var(--green)} .far{color:var(--orange)}
.meta{color:var(--muted);font-size:13px;margin-top:8px}
.list{display:grid;gap:12px;margin-top:14px}
.card{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--sep)}
.card img{width:84px;height:84px;object-fit:contain;border-radius:10px;background:#fff}
.ph{width:84px;height:84px;border-radius:10px;background:var(--fill)}
.card .t{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;direction:ltr;text-align:left}
.price{font-size:22px;font-weight:800;margin-top:4px}
.bd{font-size:12.5px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--muted)}
.tag.good{background:var(--brand-soft);color:var(--accent)}
.tag.warn{color:var(--orange)}
.open{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.55;overflow-wrap:anywhere}
html,body{overflow-x:hidden}
.err{margin-top:18px;padding:14px;border-radius:14px;background:var(--bg2);color:var(--red)}
.skel{height:108px;border-radius:16px;background:linear-gradient(90deg,var(--bg2),var(--fill),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:380px){ h1{font-size:26px} .card{grid-template-columns:68px 1fr} .card img,.ph{width:68px;height:68px} }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="appicon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></div>
    <div class="logo">צייד</div>
    <div class="live"><i></i>נתונים חיים · eBay</div>
  </div>

  <h1>מה מחפשים?</h1>
  <p class="lead">כתוב כל מוצר חדש. אראה לך את המחיר הסופי עד הדלת בישראל, כולל משלוח ומע״מ.</p>

  <form class="form" id="f">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="q" type="search" placeholder="למשל: airpods pro 2, kindle paperwhite" autocomplete="off" dir="auto" required minlength="2">
    </label>
    <div class="row">
      <label class="field"><span>היעד שלי ₪</span><input id="target" type="number" inputmode="numeric" min="1" placeholder="לא חובה"></label>
      <label class="field"><span>להסתיר מתחת ל-₪</span><input id="min" type="number" inputmode="numeric" min="1" placeholder="לא חובה"></label>
    </div>
    <button class="go" id="go" type="submit">חפש</button>
  </form>

  <div id="out"></div>
</div>

<script>
const API = 'https://imyhdvtdsotawkvyipbq.supabase.co/functions/v1/api';
const $ = (s) => document.querySelector(s);
const ils = (n) => '₪' + Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REASONS = { accessory: 'אביזרים/חלקים', wrong_model: 'דגם אחר', counterfeit_risk: 'חשד לזיוף', new_seller: 'מוכר חדש', low_rating: 'דירוג נמוך',
  not_new: 'לא חדש', wrong_variant: 'גרסה אחרת', multi_variant: 'כמה דגמים במודעה אחת', bait: 'פיתיון', off_platform: 'תשלום מחוץ ל-eBay',
  no_price_or_shipping: 'בלי משלוח לישראל', out_of_stock: 'אזל', below_your_minimum: 'מתחת למינימום שלך', too_cheap: 'זול בצורה חשודה' };
const COUNTRY = { US: 'ארה״ב', GB: 'בריטניה', DE: 'גרמניה', JP: 'יפן', AU: 'אוסטרליה', IT: 'איטליה', FR: 'צרפת', CN: 'סין', HK: 'הונג קונג', PL: 'פולין', ES: 'ספרד', NL: 'הולנד', CA: 'קנדה', IL: 'ישראל' };
const hhmm = (iso) => new Intl.DateTimeFormat('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }).format(new Date(iso));
let state = { cat: null, last: null };

$('#f').addEventListener('submit', (e) => { e.preventDefault(); state.cat = null; run(); });

async function run() {
  const q = $('#q').value.trim(); if (q.length < 2) return;
  const p = new URLSearchParams({ q });
  if (state.cat) p.set('cat', state.cat);
  const min = Number($('#min').value); if (min > 0) p.set('min', min);
  $('#go').disabled = true;
  $('#out').innerHTML = '<div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  try {
    const r = await fetch(API + '?' + p, { headers: { Accept: 'application/json' } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error === 'rate_limited' ? 'יותר מדי חיפושים בדקה. נסה שוב עוד רגע.' : j.error === 'source_unavailable' ? 'eBay לא ענה כרגע. נסה שוב.' : 'שגיאה: ' + (j.error || r.status));
    state.last = j; render(j);
  } catch (e) {
    $('#out').innerHTML = `<div class="err">${esc(e.message === 'Failed to fetch' ? 'לא הצלחתי להתחבר לשרת החיפוש מהעמוד הזה.' : e.message)}</div>`;
  } finally { $('#go').disabled = false; }
}

function render(j) {
  const target = Number($('#target').value) || null;
  const best = j.offers[0];
  let html = '';
  if (j.categories?.length > 1) {
    html += '<div class="chips">' + j.categories.map((c) => `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="${j.category?.id === c.id}">${esc(c.name)}</button>`).join('') + '</div>';
  }
  html += '<div class="summary">';
  if (best) {
    html += `<div class="meta" style="margin:0 0 2px">הכי זול שמצאתי, עד הדלת:</div><div class="big num">${ils(best.totalILS)}${best.customsMayApply ? '+' : ''}</div>`;
    if (target) {
      const gap = Math.round((best.totalILS - target) / target * 100);
      html += best.totalILS <= target ? `<div class="verdict ok">✓ בתוך היעד שלך (${ils(target)})</div>` : `<div class="verdict far">${gap}% מעל היעד שלך (${ils(target)})</div>`;
    }
  } else {
    html += `<div class="verdict">לא מצאתי אף מודעה שעוברת את הסינון.</div>`;
  }
  const ex = Object.entries(j.excluded || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${REASONS[k] || k} ${n}`).join(' · ');
  html += `<div class="meta">${j.returned} מודעות נבדקו ב-eBay · ${j.eligible} עברו${ex ? ' · סוננו: ' + esc(ex) : ''}</div>`;
  html += `<div class="meta">נבדק ${hhmm(j.checkedAt)}${j.category?.name ? ' · קטגוריה: ' + esc(j.category.name) : ''}</div></div>`;

  html += '<div class="list">' + j.offers.map((o) => {
    const inT = target && o.totalILS <= target;
    const tags = [
      inT ? '<span class="tag good">בתוך היעד</span>' : '',
      o.topRated ? '<span class="tag good">Top Rated</span>' : '',
      o.seller?.feedbackPct ? `<span class="tag">מוכר ${o.seller.feedbackPct}% · ${Number(o.seller.feedbackScore).toLocaleString('en-US')} דירוגים</span>` : '',
      o.country ? `<span class="tag">נשלח מ${esc(COUNTRY[o.country] || o.country)}</span>` : '',
      o.customsMayApply ? '<span class="tag warn">ייתכן מכס נוסף</span>' : '',
    ].join('');
    return `<article class="card">
      ${o.image ? `<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="ph"></div>'}
      <div>
        <div class="t">${esc(o.title)}</div>
        <div class="price num">${ils(o.totalILS)}${o.customsMayApply ? '+' : ''} <span class="bd">עד הדלת</span></div>
        <div class="bd num">מוצר ${ils(o.itemILS)} + משלוח ${ils(o.shipILS)}${o.vatILS ? ' + מע״מ ' + ils(o.vatILS) : ' · בלי מע״מ (מתחת ל-$150)'}</div>
        <div class="tags">${tags}</div>
        <a class="open" href="${esc(o.url)}" target="_blank" rel="noopener">לצפייה ב-eBay ←</a>
      </div></article>`;
  }).join('') + '</div>';

  html += `<p class="note">נבדק רק eBay, לא כל השוק. מחירי eBay מומרים לשקלים לפי שער ${j.fx.usdToIls}${j.fx.asOf ? ' (' + esc(j.fx.asOf) + ')' : ''}. מע״מ 18% מחושב על מוצר מעל $${j.rules.vatFreeUSD}; מעל $${j.rules.customsFlagUSD} ייתכן מכס/מס קנייה שלא חושב (מסומן +). בחיפוש חופשי אין התחייבות שזה בדיוק הדגם: בדוק את הכותרת. שלם רק בתוך eBay.</p>`;
  $('#out').innerHTML = html;
  document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => { state.cat = b.dataset.cat; run(); }));
}
$('#target').addEventListener('input', () => state.last && render(state.last));
</script>
</body>
</html>

  </div>

  <h1>מה מחפשים?</h1>
  <p class="lead">כתוב כל מוצר חדש. אראה לך את המחיר הסופי עד הדלת בישראל, כולל משלוח ומע״מ.</p>

  <form class="form" id="f">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <input id="q" type="search" placeholder="למשל: airpods pro 2, kindle paperwhite" autocomplete="off" dir="auto" required minlength="2">
    </label>
    <div class="row">
      <label class="field"><span>היעד שלי ₪</span><input id="target" type="number" inputmode="numeric" min="1" placeholder="לא חובה"></label>
      <label class="field"><span>להסתיר מתחת ל-₪</span><input id="min" type="number" inputmode="numeric" min="1" placeholder="לא חובה"></label>
    </div>
    <button class="go" id="go" type="submit">חפש</button>
  </form>

  <div id="out"></div>
</div>

<script>
const API = 'https://imyhdvtdsotawkvyipbq.supabase.co/functions/v1/api';
const $ = (s) => document.querySelector(s);
const ils = (n) => '₪' + Math.round(n).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const REASONS = { accessory: 'אביזרים/חלקים', wrong_model: 'דגם אחר', counterfeit_risk: 'חשד לזיוף', new_seller: 'מוכר חדש', low_rating: 'דירוג נמוך',
  not_new: 'לא חדש', wrong_variant: 'גרסה אחרת', multi_variant: 'כמה דגמים במודעה אחת', bait: 'פיתיון', off_platform: 'תשלום מחוץ ל-eBay',
  no_price_or_shipping: 'בלי משלוח לישראל', out_of_stock: 'אזל', below_your_minimum: 'מתחת למינימום שלך', too_cheap: 'זול בצורה חשודה' };
const COUNTRY = { US: 'ארה״ב', GB: 'בריטניה', DE: 'גרמניה', JP: 'יפן', AU: 'אוסטרליה', IT: 'איטליה', FR: 'צרפת', CN: 'סין', HK: 'הונג קונג', PL: 'פולין', ES: 'ספרד', NL: 'הולנד', CA: 'קנדה', IL: 'ישראל' };
const hhmm = (iso) => new Intl.DateTimeFormat('he-IL', { timeZone: 'Asia/Jerusalem', hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }).format(new Date(iso));
let state = { cat: null, last: null };

$('#f').addEventListener('submit', (e) => { e.preventDefault(); state.cat = null; run(); });

async function run() {
  const q = $('#q').value.trim(); if (q.length < 2) return;
  const p = new URLSearchParams({ q });
  if (state.cat) p.set('cat', state.cat);
  const min = Number($('#min').value); if (min > 0) p.set('min', min);
  $('#go').disabled = true;
  $('#out').innerHTML = '<div class="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  try {
    const r = await fetch(API + '?' + p, { headers: { Accept: 'application/json' } });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error === 'rate_limited' ? 'יותר מדי חיפושים בדקה. נסה שוב עוד רגע.' : j.error === 'source_unavailable' ? 'eBay לא ענה כרגע. נסה שוב.' : 'שגיאה: ' + (j.error || r.status));
    state.last = j; render(j);
  } catch (e) {
    $('#out').innerHTML = `<div class="err">${esc(e.message === 'Failed to fetch' ? 'לא הצלחתי להתחבר לשרת החיפוש מהעמוד הזה.' : e.message)}</div>`;
  } finally { $('#go').disabled = false; }
}

function render(j) {
  const target = Number($('#target').value) || null;
  const best = j.offers[0];
  let html = '';
  if (j.categories?.length > 1) {
    html += '<div class="chips">' + j.categories.map((c) => `<button class="chip" data-cat="${esc(c.id)}" aria-pressed="${j.category?.id === c.id}">${esc(c.name)}</button>`).join('') + '</div>';
  }
  html += '<div class="summary">';
  if (best) {
    html += `<div class="meta" style="margin:0 0 2px">הכי זול שמצאתי, עד הדלת:</div><div class="big num">${ils(best.totalILS)}${best.customsMayApply ? '+' : ''}</div>`;
    if (target) {
      const gap = Math.round((best.totalILS - target) / target * 100);
      html += best.totalILS <= target ? `<div class="verdict ok">✓ בתוך היעד שלך (${ils(target)})</div>` : `<div class="verdict far">${gap}% מעל היעד שלך (${ils(target)})</div>`;
    }
  } else {
    html += `<div class="verdict">לא מצאתי אף מודעה שעוברת את הסינון.</div>`;
  }
  const ex = Object.entries(j.excluded || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${REASONS[k] || k} ${n}`).join(' · ');
  html += `<div class="meta">${j.returned} מודעות נבדקו ב-eBay · ${j.eligible} עברו${ex ? ' · סוננו: ' + esc(ex) : ''}</div>`;
  html += `<div class="meta">נבדק ${hhmm(j.checkedAt)}${j.category?.name ? ' · קטגוריה: ' + esc(j.category.name) : ''}</div></div>`;

  html += '<div class="list">' + j.offers.map((o) => {
    const inT = target && o.totalILS <= target;
    const tags = [
      inT ? '<span class="tag good">בתוך היעד</span>' : '',
      o.topRated ? '<span class="tag good">Top Rated</span>' : '',
      o.seller?.feedbackPct ? `<span class="tag">מוכר ${o.seller.feedbackPct}% · ${Number(o.seller.feedbackScore).toLocaleString('en-US')} דירוגים</span>` : '',
      o.country ? `<span class="tag">נשלח מ${esc(COUNTRY[o.country] || o.country)}</span>` : '',
      o.customsMayApply ? '<span class="tag warn">ייתכן מכס נוסף</span>' : '',
    ].join('');
    return `<article class="card">
      ${o.image ? `<img src="${esc(o.image)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="ph"></div>'}
      <div>
        <div class="t">${esc(o.title)}</div>
        <div class="price num">${ils(o.totalILS)}${o.customsMayApply ? '+' : ''} <span class="bd">עד הדלת</span></div>
        <div class="bd num">מוצר ${ils(o.itemILS)} + משלוח ${ils(o.shipILS)}${o.vatILS ? ' + מע״מ ' + ils(o.vatILS) : ' · בלי מע״מ (מתחת ל-$150)'}</div>
        <div class="tags">${tags}</div>
        <a class="open" href="${esc(o.url)}" target="_blank" rel="noopener">לצפייה ב-eBay ←</a>
      </div></article>`;
  }).join('') + '</div>';

  html += `<p class="note">נבדק רק eBay, לא כל השוק. מחירי eBay מומרים לשקלים לפי שער ${j.fx.usdToIls}${j.fx.asOf ? ' (' + esc(j.fx.asOf) + ')' : ''}. מע״מ 18% מחושב על מוצר מעל $${j.rules.vatFreeUSD}; מעל $${j.rules.customsFlagUSD} ייתכן מכס/מס קנייה שלא חושב (מסומן +). בחיפוש חופשי אין התחייבות שזה בדיוק הדגם: בדוק את הכותרת. שלם רק בתוך eBay.</p>`;
  $('#out').innerHTML = html;
  document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => { state.cat = b.dataset.cat; run(); }));
}
$('#target').addEventListener('input', () => state.last && render(state.last));
</script>
</body>
</html>
